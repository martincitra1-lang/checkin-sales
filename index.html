<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-In Sales</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--biru:#0F2C4C;--aksen:#1D6FE0;--hijau:#12855B;--merah:#C7382E;--latar:#F5F7FA;--garis:#dde3ea;--teks:#1a2028;--redup:#6b7684}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--latar);color:var(--teks);font-size:14px;line-height:1.45}
  .wrap{max-width:430px;margin:0 auto;padding:0 0 70px;padding-bottom:96px;}
  .wrap.wide{max-width:1100px;padding:20px}
  header.app{background:var(--biru);color:#fff;padding:16px 18px;border-radius:0 0 14px 14px}
  header.app h1{margin:0;font-size:16px;font-weight:600}
  header.app .sub{font-size:12px;opacity:.75;margin-top:2px}
  .card{background:#fff;border-radius:10px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(16,38,64,.08)}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--redup);font-weight:600;margin-bottom:6px}
  select,input,textarea{width:100%;padding:10px;border:1px solid var(--garis);border-radius:8px;font:inherit;background:#fff}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:12px;font-weight:600}
  .btn-primary{background:var(--aksen);color:#fff;width:100%}
  .btn-danger{background:var(--merah);color:#fff;width:100%}
  .btn-ghost{background:#eef2f7;color:var(--biru);padding:8px 12px;font-size:12px}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:6px}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .b-hijau{background:#e3f4ec;color:var(--hijau)}
  .b-merah{background:#fbe9e7;color:var(--merah)}
  .b-kuning{background:#fdf3e0;color:#8a6100}
  .b-abu{background:#eef2f7;color:var(--redup)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0f3f7}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--redup);font-size:12px}
  .row .v{font-weight:600;font-size:13px;text-align:right}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:var(--biru);color:#fff;text-align:left;padding:7px 8px;font-weight:600}
  td{padding:7px 8px;border-bottom:1px solid #eef2f7;vertical-align:top}
  tr:nth-child(even) td{background:#fafbfd}
  .kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
  .kpi .box{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(16,38,64,.08)}
  .kpi .n{font-size:22px;font-weight:700;color:var(--biru)}
  .kpi .t{font-size:11px;color:var(--redup);text-transform:uppercase;font-weight:600}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--garis);display:flex;max-width:430px;margin:0 auto}
  .nav button{flex:1;background:none;color:var(--redup);padding:10px 0;font-size:12px;border-radius:0}
  .nav button.on{color:var(--aksen);font-weight:700}
  .nav.wide{max-width:1100px}
  .grid2{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:900px){.grid2{grid-template-columns:1fr 1fr;gap:12px;align-items:start}}
  .nav button{padding:14px 0;min-height:48px}
  .wrap.wide{padding-bottom:96px}
  .err{background:#fbe9e7;color:var(--merah);padding:10px 12px;border-radius:8px;font-size:12px;margin:8px 0}
  .ok{background:#e3f4ec;color:var(--hijau);padding:10px 12px;border-radius:8px;font-size:12px;margin:8px 0}
  .warn{color:#8a6d1f;background:#fdf3d6;border-radius:8px;padding:6px 8px;font-size:12px;margin-top:6px;}
.muted{color:var(--redup);font-size:12px}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{background:#eef2f7;color:var(--biru);padding:8px 12px;font-size:12px}
  .tabs button.on{background:var(--aksen);color:#fff}
  .modal-bg{position:fixed;inset:0;background:rgba(15,44,76,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
  .modal-box{background:#fff;border-radius:12px;padding:18px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.22)}
  .modal-box h2{margin:0 0 8px;font-size:16px;color:var(--biru)}
  .modal-actions{display:flex;gap:8px;margin-top:14px}
  .modal-actions button{flex:1}
  button:disabled{opacity:.55;cursor:not-allowed}
  .dd-wrap{position:relative}
  .dd-btn{width:100%;padding:10px 12px;border:1px solid var(--garis);border-radius:8px;background:#fff;color:var(--teks);font-weight:500;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dd-btn:focus{outline:2px solid var(--aksen);border-color:var(--aksen)}
  .dd-btn .dd-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .dd-btn .dd-arr{color:var(--redup);font-size:12px;flex-shrink:0}
  .dd-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--garis);border-radius:10px;box-shadow:0 8px 24px rgba(15,44,76,.15);z-index:60;display:none;overflow:hidden}
  .dd-menu.open{display:block}
  .dd-search-box{padding:8px;border-bottom:1px solid #eef2f7;background:#fafbfd}
  .dd-search-box input{padding:8px 10px;font-size:13px}
  .dd-list{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .dd-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f4f6f9}
  .dd-item:last-child{border-bottom:none}
  .dd-item:hover{background:#f2f6fc}
  .dd-item.on{background:#e7f1fd}
  .dd-item .dd-main{font-size:13px;font-weight:600;color:var(--teks)}
  .dd-item.on .dd-main{color:var(--aksen)}
  .dd-item .dd-sub{font-size:11px;color:var(--redup);margin-top:2px}
  .dd-empty{padding:12px;text-align:center;color:var(--redup);font-size:12px}
  .map-box{width:100%;height:360px;border-radius:10px;border:1px solid var(--garis);overflow:hidden;background:#e9eef5;margin-top:8px;z-index:1}
  .pin-num{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .pin-start{background:#12855B}
  .pin-mid{background:#1D6FE0}
  .pin-end{background:#C7382E}
  .rute-list{margin-top:10px;border-top:1px solid #eef2f7;padding-top:8px}
  .rute-step{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f0f3f7}
  .rute-step:last-child{border-bottom:none}
  .rute-no{width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
  .btn-link{display:inline-block;text-align:center;text-decoration:none;font:inherit;font-weight:600;border-radius:8px;padding:10px 12px;background:#12855B;color:#fff;width:100%;margin-top:10px}
  .pin-live{padding:3px 7px;border-radius:14px;color:#fff;font-weight:700;font-size:11px;white-space:nowrap;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);text-align:center}
  .pin-live-on{background:#12855B}
  .pin-live-idle{background:#1D6FE0}
  .nav.wide button{font-size:11px;padding:12px 2px}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading" style="position:fixed;inset:0;background:rgba(245,247,250,.9);display:none;align-items:center;justify-content:center;z-index:99;font-weight:600;color:#0F2C4C">Memuat...</div>
<script>
/* ===== ADAPTER SERVER ===== */
var state={user:null,tab:'toko',adminTab:'titik',spvTab:'tim',pesan:null,pesanTipe:'ok',lokasi:null,akurasi:null,gpsStatus:'idle',gpsErr:null,konfirmasiToko:null,tokoPanel:null,cariToko:'',csvPreview:null,csvNamaFile:'',csvErr:null,petaSales:null,batas30Hari:'',jumlahCheckinLama:0,liveAutoRefresh:true,liveSales:[],liveLastRefresh:'',liveFokus:null,liveLoading:false,loading:true,tanggal:'',hariIni:'',pilihToko:null};
var db={outlets:[],checkins:[],users:[],aksesSPV:[],audit:[],settings:{radius_default:100,akurasi_maks:50,jam_mulai:'07:00',jam_selesai:'17:00',radius_min:30,radius_maks:300,lock_device_sales:true}};
var SKEY='checkin_gas_sesi_v1';
var DKEY='checkin_gas_device_id_v1';
var _cachedDeviceInfo='';

function getDeviceId(){
  var id='';
  try{id=localStorage.getItem(DKEY)||'';}catch(e){}
  if(!id){
    var rand='';
    try{
      if(window.crypto&&crypto.getRandomValues){
        var arr=new Uint8Array(8);
        crypto.getRandomValues(arr);
        for(var i=0;i<arr.length;i++){rand+=('0'+arr[i].toString(16)).slice(-2);}
      }
    }catch(e){}
    if(!rand)rand=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
    id='DEV-'+rand.toUpperCase();
    try{localStorage.setItem(DKEY,id);}catch(e){}
  }
  return id;
}

function parseUAFallback(ua){
  var os='Unknown OS', model='', browser='Browser';
  var mAnd=ua.match(/Android\s+([0-9._]+)/i);
  if(mAnd){
    os='Android '+mAnd[1];
    var mMod=ua.match(/Android[^;]*;\s*([^;)]+?)(?:\s+Build\/|\))/i);
    if(mMod&&mMod[1]&&mMod[1].trim()!=='K')model=mMod[1].trim();
  }else if(/iPhone/i.test(ua)){
    var mIos=ua.match(/OS\s+([0-9_]+)/i);
    model='iPhone';
    os='iOS'+(mIos?' '+mIos[1].replace(/_/g,'.'):'');
  }else if(/iPad/i.test(ua)){
    model='iPad';
    os='iPadOS';
  }else if(/Windows NT/i.test(ua)){
    os='Windows';
  }else if(/Mac OS X/i.test(ua)){
    os='macOS';
  }
  if(/EdgA?\//i.test(ua))browser='Edge';
  else if(/SamsungBrowser/i.test(ua))browser='Samsung Internet';
  else if(/OPR\/|Opera/i.test(ua))browser='Opera';
  else if(/CriOS|Chrome\//i.test(ua))browser='Chrome';
  else if(/FxiOS|Firefox\//i.test(ua))browser='Firefox';
  else if(/Safari\//i.test(ua))browser='Safari';
  var layar=(window.screen?(screen.width+'x'+screen.height):'');
  return [model,os,browser,layar].filter(Boolean).join(' | ');
}

function ambilInfoPerangkat(){
  if(_cachedDeviceInfo)return Promise.resolve(_cachedDeviceInfo);
  var ua=String(navigator.userAgent||'');
  var fallback=parseUAFallback(ua);
  if(navigator.userAgentData&&typeof navigator.userAgentData.getHighEntropyValues==='function'){
    return navigator.userAgentData.getHighEntropyValues(['model','platform','platformVersion','fullVersionList']).then(function(h){
      var model=String(h.model||'').trim();
      var plat=String(h.platform||'').trim();
      var pver=String(h.platformVersion||'').trim();
      if(plat==='Android'&&pver)plat='Android '+pver.split('.')[0];
      var br='';
      if(Array.isArray(h.fullVersionList)){
        for(var i=0;i<h.fullVersionList.length;i++){
          var b=h.fullVersionList[i];
          if(b&&b.brand&&!/Not.*Brand/i.test(b.brand)&&!/Chromium/i.test(b.brand)){
            br=b.brand.replace(/Google /i,'')+(b.version?' '+String(b.version).split('.')[0]:'');
            break;
          }
        }
      }
      var layar=(window.screen?(screen.width+'x'+screen.height):'');
      var info=[model,plat,br,layar].filter(Boolean).join(' | ');
      _cachedDeviceInfo=info||fallback;
      return _cachedDeviceInfo;
    }).catch(function(){
      _cachedDeviceInfo=fallback;
      return _cachedDeviceInfo;
    });
  }
  _cachedDeviceInfo=fallback;
  return Promise.resolve(_cachedDeviceInfo);
}

var API_URL='https://script.google.com/macros/s/AKfycbwfs31wIlYlptkHJYuv_GXruPB8PZp188svfy5QK2C7OBgR9ReX7VMI-W35nRR9JZcmiA/exec';

function panggil(fn,args){
  return fetch(API_URL,{
    method:'POST',
    redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({fn:fn,args:args||[]})
  }).then(function(res){
    return res.text().then(function(txt){
      if(!res.ok)throw new Error('HTTP '+res.status);
      try{return JSON.parse(txt);}
      catch(e){throw new Error('Respons server bukan JSON (pastikan doPost sudah di-deploy dengan akses Anyone)');}
    });
  });
}

function nowDate(){return state.tanggal;}
function pad2(n){return String(n).padStart(2,'0');}

function namaSales(kode){
  if(state.user&&state.user.kode===kode)return state.user.nama;
  for(var i=0;i<db.users.length;i++){if(db.users[i].login===kode)return db.users[i].nama;}
  return kode;
}

function mapOutlet(o){
  return {
    kode:String(o.kode_toko==null?'':o.kode_toko), nama:String(o.nama_toko==null?'':o.nama_toko), alamat:String(o.alamat==null?'':o.alamat), kota:String(o.kota==null?'':o.kota), kecamatan:String(o.kecamatan==null?'':o.kecamatan),
    lat:(o.latitude===''||o.latitude==null)?null:Number(o.latitude),
    lng:(o.longitude===''||o.longitude==null)?null:Number(o.longitude),
    radius:(o.radius_m===''||o.radius_m==null)?null:Number(o.radius_m),
    status:o.status_titik, aktif:o.aktif
  };
}

function mapCheckin(c){
  return {
    checkin_id:c.checkin_id, tanggal:String(c.tanggal), sales:c.kode_sales, nama_sales:namaSales(c.kode_sales),
    kode_toko:c.kode_toko, nama_toko:c.nama_toko_snapshot,
    jam_masuk:c.jam_masuk, jam_keluar:c.jam_keluar||'',
    lat:(c.latitude_sales===''||c.latitude_sales==null)?null:Number(c.latitude_sales),
    lng:(c.longitude_sales===''||c.longitude_sales==null)?null:Number(c.longitude_sales),
    akurasi_m:(c.akurasi_m===''||c.akurasi_m==null)?null:Number(c.akurasi_m),
    jarak_m:(c.jarak_m===''||c.jarak_m==null)?null:Number(c.jarak_m),
    validasi_status:c.validasi_status, status_batal:c.status_batal||'AKTIF',
    alasan_batal:c.alasan_batal||'', dibatalkan_by:c.dibatalkan_by||'', dibatalkan_at:c.dibatalkan_at||'', device_info:c.device_info||''
  };
}

function isiDB(data){
  var s=data.settings||{};
  db.settings={radius_default:s.radius_default_m||100,akurasi_maks:s.akurasi_maks_m||50,
    jam_mulai:s.jam_kerja_mulai||'07:00',jam_selesai:s.jam_kerja_selesai||'17:00',
    radius_min:s.radius_min_m||30,radius_maks:s.radius_maks_m||300,lock_device_sales:s.lock_device_sales!==false};
  if(!state.tanggal)state.tanggal=data.tanggal||'';
  state.hariIni=data.tanggal||'';
  state.batas30Hari=data.batas30Hari||'';
  state.jumlahCheckinLama=Number(data.jumlahCheckinLama||0);
  if(state.batas30Hari&&state.tanggal&&state.tanggal<state.batas30Hari)state.tanggal=state.hariIni;
  db.users=(data.users||[]).map(function(u){return {login:u.kode_sales,nama:u.nama,role:u.role,aktif:u.aktif,device_id:u.device_id||'',device_info:u.device_info||'',last_lat:(u.last_lat===''||u.last_lat==null)?null:Number(u.last_lat),last_lng:(u.last_lng===''||u.last_lng==null)?null:Number(u.last_lng),last_akurasi_m:(u.last_akurasi_m===''||u.last_akurasi_m==null)?null:Number(u.last_akurasi_m),last_loc_at:u.last_loc_at||''};});
  db.outlets=(data.outlets||[]).map(mapOutlet);
  db.checkins=(data.checkins||[]).map(mapCheckin);
  db.aksesSPV=(data.aksesSPV||[]).map(function(a){
    return typeof a==='string'?{spv:state.user.kode,kode_sales:a,aktif:true}:{spv:a.spv_user_id,kode_sales:a.kode_sales,aktif:a.aktif};
  });
  db.audit=(data.audit||[]).map(function(l){return {log_id:l.log_id,timestamp:l.timestamp,user:l.user_id,aksi:l.aksi,detail:l.detail};});
}

function muatData(){
  if(!state.user)return Promise.resolve();
  return panggil('getBootstrap',[state.user.kode,getDeviceId()]).then(function(data){
    if(!data||!data.ok)throw new Error((data&&data.msg)||'Gagal memuat data');
    isiDB(data);
    state.user={kode:data.user.kode_sales,nama:data.user.nama,role:data.user.role,area:data.user.area};
    state.loading=false;
  });
}

function tampilLoading(on){
  var el2=document.getElementById('loading');
  if(el2)el2.style.display=on?'flex':'none';
}

function jalankan(p){
  state.pesan=null;tampilLoading(true);
  return p.then(function(r){
    if(r&&r.ok===false){state.pesan=r.msg||'Gagal';state.pesanTipe='err';return null;}
    state.pesan=(r&&r.msg)?r.msg:'Tersimpan';state.pesanTipe='ok';
    return muatData();
  }).catch(function(e){
    state.pesan='Gagal: '+(e&&e.message?e.message:e);state.pesanTipe='err';
  }).then(function(){
    tampilLoading(false);render();
  });
}

function cekAkses(kodeInput,pinInput){
  var kode=String(kodeInput||'').trim().toUpperCase();
  var pin=String(pinInput||'').trim();
  if(!kode||!pin)return Promise.resolve({ok:false,msg:'ID dan PIN wajib diisi'});
  tampilLoading(true);
  return ambilInfoPerangkat().then(function(devInfo){
    return panggil('login',[kode,pin,getDeviceId(),devInfo]);
  }).then(function(r){
    if(!r.ok){tampilLoading(false);return r;}
    state.user={kode:r.user.kode_sales,nama:r.user.nama,role:r.user.role,area:r.user.area};
    localStorage.setItem(SKEY,JSON.stringify({kode:state.user.kode}));
    return muatData().then(function(){tampilLoading(false);return {ok:true,msg:r.msg};});
  }).catch(function(e){tampilLoading(false);return {ok:false,msg:String(e&&e.message?e.message:e)};});
}

function logout(){
  hentikanTrackingSales();
  hentikanAutoRefreshLokasi();
  localStorage.removeItem(SKEY);
  state.user=null;state.tab='toko';state.adminTab='titik';state.spvTab='tim';state.pesan=null;
  state.pilihToko=null;state.lokasi=null;state.akurasi=null;state.gpsStatus='idle';state.gpsErr=null;state.konfirmasiToko=null;state.tokoPanel=null;state.cariToko='';state.csvPreview=null;state.csvNamaFile='';state.csvErr=null;state.petaSales=null;state.tanggal='';state.hariIni='';state.batas30Hari='';state.jumlahCheckinLama=0;state.liveSales=[];state.liveLastRefresh='';state.liveFokus=null;state.liveLoading=false;
  db.checkins=[];db.outlets=[];db.users=[];db.aksesSPV=[];db.audit=[];
  render();
}

function cekinAktif(){
  if(!state.user)return null;
  for(var i=0;i<db.checkins.length;i++){
    var c=db.checkins[i];
    if(c.sales===state.user.kode&&c.tanggal===state.tanggal&&!c.jam_keluar&&c.status_batal!=='BATAL')return c;
  }
  return null;
}

function outletByKode(k){var kk=String(k==null?'':k);for(var i=0;i<db.outlets.length;i++){if(String(db.outlets[i].kode)===kk)return db.outlets[i];}return null;}
function adaTitik(o){return o&&o.status==='TITIK_FINAL'&&o.lat!=null&&o.lng!=null;}

/* ===== API ===== */
var api={
  checkin:function(kodeToko,lat,lng,akurasi){return ambilInfoPerangkat().then(function(devInfo){return panggil('checkin',[state.user.kode,kodeToko,lat,lng,akurasi,devInfo,getDeviceId()]);});},
  checkout:function(id){return panggil('checkout',[state.user.kode,id,getDeviceId()]);},
  updateLokasiSales:function(lat,lng,akurasi){return panggil('updateLokasiSales',[state.user.kode,lat,lng,akurasi,getDeviceId()]);},
  getLokasiSales:function(){return panggil('getLokasiSales',[state.user.kode]);},
  setTitikToko:function(kode,lat,lng,radius){return panggil('setTitikToko',[state.user.kode,kode,lat,lng,radius]);},
  hapusTitikToko:function(kode){return panggil('hapusTitikToko',[state.user.kode,kode]);},
  setRadiusSemuaToko:function(radius){return panggil('setRadiusSemuaToko',[state.user.kode,radius]);},
  tambahToko:function(kodeToko,namaToko,alamat,kota,kecamatan,lat,lng,radius){return panggil('tambahToko',[state.user.kode,kodeToko,namaToko,alamat,kota,kecamatan,lat,lng,radius]);},
  importToko:function(listToko){return panggil('importToko',[state.user.kode,listToko]);},
  batalKunjungan:function(id,alasan){return panggil('batalKunjungan',[state.user.kode,id,alasan]);},

function el(tag,attrs){
  var kids=Array.prototype.slice.call(arguments,2);
  var e=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    if(k.indexOf('on')===0&&typeof attrs[k]==='function'){e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);}
    else if(k==='class'){e.className=attrs[k];}
    else if(k==='html'){e.innerHTML=attrs[k];}
    else if(k==='disabled'){e.disabled=!!attrs[k];}
    else{e.setAttribute(k,attrs[k]);}
  });}
  kids.forEach(function(k){
    if(k==null||k===false)return;
    e.appendChild((typeof k==='string'||typeof k==='number')?document.createTextNode(String(k)):k);
  });
  return e;
}

var _salesTrackTimer=null;
var _salesLastPingAt=0;

function kirimLokasiLive(lat,lng,ak,paksa){
  if(!state.user||state.user.role!=='SALES')return;
  var now=Date.now();
  if(!paksa&&(now-_salesLastPingAt)<25000)return;
  _salesLastPingAt=now;
  api.updateLokasiSales(lat,lng,ak).catch(function(){});
}

function mulaiTrackingSales(){
  if(_salesTrackTimer)return;
  if(!navigator.geolocation)return;
  _salesTrackTimer=setInterval(function(){
    if(!state.user||state.user.role!=='SALES'){hentikanTrackingSales();return;}
    if(document.visibilityState==='hidden')return;
    navigator.geolocation.getCurrentPosition(function(p){
      state.lokasi={lat:p.coords.latitude,lng:p.coords.longitude};
      state.akurasi=Math.round(p.coords.accuracy||0);
      state.gpsStatus='ok';
      state.gpsErr=null;
      kirimLokasiLive(p.coords.latitude,p.coords.longitude,state.akurasi,true);
    },function(){},{enableHighAccuracy:true,timeout:12000,maximumAge:10000});
  },60000);
}

function hentikanTrackingSales(){
  if(_salesTrackTimer){clearInterval(_salesTrackTimer);_salesTrackTimer=null;}
}

function mulaiGPS(paksa){
  if(!paksa&&state.gpsStatus!=='idle')return;
  if(!navigator.geolocation){
    state.gpsStatus='err';
    state.gpsErr='Perangkat atau browser tidak mendukung GPS.';
    render();
    return;
  }
  state.gpsStatus='loading';
  state.gpsErr=null;
  render();
  navigator.geolocation.getCurrentPosition(function(p){
    state.lokasi={lat:p.coords.latitude,lng:p.coords.longitude};
    state.akurasi=Math.round(p.coords.accuracy||0);
    state.gpsStatus='ok';
    state.gpsErr=null;
    kirimLokasiLive(p.coords.latitude,p.coords.longitude,state.akurasi,true);
    render();
  },function(e){
    state.gpsStatus='err';
    var msg='GPS gagal diambil ('+e.message+'). Pastikan GPS aktif & izinkan akses lokasi di browser, lalu klik Refresh GPS.';
    state.gpsErr=msg;
    render();
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

function parseCsvBaris(teks, delim){
  var rows=[], cur=[], val='', inQ=false;
  for(var i=0;i<teks.length;i++){
    var ch=teks[i], nx=teks[i+1];
    if(inQ){
      if(ch==='"'&&nx==='"'){val+='"';i++;}
      else if(ch==='"'){inQ=false;}
      else{val+=ch;}
    }else{
      if(ch==='"'){inQ=true;}
      else if(ch===delim){cur.push(val.trim());val='';}
      else if(ch==='\r'&&nx==='\n'){cur.push(val.trim());rows.push(cur);cur=[];val='';i++;}
      else if(ch==='\n'||ch==='\r'){cur.push(val.trim());rows.push(cur);cur=[];val='';}
      else{val+=ch;}
    }
  }
  if(val!==''||cur.length>0){cur.push(val.trim());rows.push(cur);}
  return rows.filter(function(r){return r.some(function(x){return x!=='';});});
}

function parseCsvToko(raw){
  var teks=String(raw||'').replace(/^\ufeff/,'').trim();
  if(!teks)return {ok:false,msg:'File CSV kosong'};
  var firstLine=teks.split(/\r?\n/)[0]||'';
  var semiCount=(firstLine.match(/;/g)||[]).length;
  var commaCount=(firstLine.match(/,/g)||[]).length;
  var delim=semiCount>commaCount?';':',';
  var rows=parseCsvBaris(teks,delim);
  if(rows.length<2)return {ok:false,msg:'CSV harus memiliki baris header dan minimal 1 baris data'};

  var norm=function(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');};
  var head=rows[0].map(norm);
  var findCol=function(aliases){
    for(var i=0;i<aliases.length;i++){
      var idx=head.indexOf(aliases[i]);
      if(idx>=0)return idx;
    }
    return -1;
  };
  var cKode=findCol(['kodetoko','kode','idtoko','id']);
  var cNama=findCol(['namatoko','nama','toko','outlet','namaoutlet']);
  var cAlamat=findCol(['alamat','address']);
  var cKota=findCol(['kota','city','kabupaten']);
  var cKec=findCol(['kecamatan','area','district']);
  var cLat=findCol(['latitude','lat']);
  var cLng=findCol(['longitude','lng','lon','long']);
  var cRad=findCol(['radiusm','radius','radiusmaksmeter']);

  if(cKode<0||cNama<0){
    return {ok:false,msg:'Header CSV wajib memiliki kolom kode_toko dan nama_toko'};
  }
  var items=[];
  for(var r=1;r<rows.length;r++){
    var row=rows[r];
    var kt=String(row[cKode]||'').trim().toUpperCase();
    var nm=String(row[cNama]||'').trim();
    if(!kt||!nm)continue;
    items.push({
      kode_toko:kt,
      nama_toko:nm,
      alamat:cAlamat>=0?(row[cAlamat]||''):'',
      kota:cKota>=0?(row[cKota]||''):'',
      kecamatan:cKec>=0?(row[cKec]||''):'',
      latitude:cLat>=0?(row[cLat]||''):'',
      longitude:cLng>=0?(row[cLng]||''):'',
      radius_m:cRad>=0?(row[cRad]||''):''
    });
  }
  if(!items.length)return {ok:false,msg:'Tidak ada baris toko yang valid (kode_toko dan nama_toko wajib terisi)'};
  return {ok:true,items:items,delim:delim};
}

var _petaLiveInstance=null;
var _adminLiveTimer=null;

function hentikanAutoRefreshLokasi(){
  if(_adminLiveTimer){clearInterval(_adminLiveTimer);_adminLiveTimer=null;}
}

function mulaiAutoRefreshLokasi(){
  hentikanAutoRefreshLokasi();
  if(!state.liveAutoRefresh)return;
  _adminLiveTimer=setInterval(function(){
    if(!state.user||state.user.role!=='ADMIN'||state.adminTab!=='lokasi'){
      hentikanAutoRefreshLokasi();
      return;
    }
    if(document.visibilityState==='hidden')return;
    muatLokasiLive(true);
  },30000);
}

function muatLokasiLive(senyap){
  if(!state.user||state.user.role!=='ADMIN')return;
  if(state.liveLoading)return;
  state.liveLoading=true;
  if(!senyap)render();
  api.getLokasiSales().then(function(r){
    state.liveLoading=false;
    if(r&&r.ok){
      state.liveSales=(r.sales||[]).map(function(u){
        return {
          kode:u.kode_sales,
          nama:u.nama,
          aktif:u.aktif,
          device_info:u.device_info||'',
          last_lat:(u.last_lat===''||u.last_lat==null)?null:Number(u.last_lat),
          last_lng:(u.last_lng===''||u.last_lng==null)?null:Number(u.last_lng),
          last_akurasi_m:(u.last_akurasi_m===''||u.last_akurasi_m==null)?null:Number(u.last_akurasi_m),
          last_loc_at:u.last_loc_at||'',
          sedang_di_toko:u.sedang_di_toko||'',
          jam_masuk_aktif:u.jam_masuk_aktif||''
        };
      });
      state.liveLastRefresh=r.server_time||'';
    }
    if(state.adminTab==='lokasi')render();
  }).catch(function(){
    state.liveLoading=false;
    if(!senyap&&state.adminTab==='lokasi')render();
  });
}

function gambarPetaLive(containerId, list){
  if(_petaLiveInstance){
    try{_petaLiveInstance.remove();}catch(e){}
    _petaLiveInstance=null;
  }
  var elMap=document.getElementById(containerId);
  if(!elMap||typeof L==='undefined')return;

  var titik=list.filter(function(s){
    return s.last_lat!=null&&s.last_lng!=null&&isFinite(s.last_lat)&&isFinite(s.last_lng)&&!(s.last_lat===0&&s.last_lng===0);
  });
  if(!titik.length){
    elMap.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#6b7684;font-size:13px;padding:16px;text-align:center">Belum ada data lokasi terbaru dari sales. Lokasi otomatis terkirim saat sales membuka aplikasi.</div>';
    return;
  }

  var map=L.map(elMap,{zoomControl:true});
  _petaLiveInstance=map;

  L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{
    maxZoom:20,
    attribution:'&copy; Google Maps'
  }).addTo(map);

  var latlngs=[];
  var fokusMarker=null;
  var fokusCoord=null;

  titik.forEach(function(s){
    var pos=[s.last_lat,s.last_lng];
    latlngs.push(pos);
    var cls=s.sedang_di_toko?'pin-live-on':'pin-live-idle';
    var icon=L.divIcon({
      className:'',
      html:'<div class="pin-live '+cls+'">'+s.kode+'</div>',
      iconSize:[64,26],
      iconAnchor:[32,13],
      popupAnchor:[0,-14]
    });
    var gUrl='https://www.google.com/maps/search/?api=1&query='+s.last_lat+','+s.last_lng;
    var popupHtml='<strong>'+s.nama+' ('+s.kode+')</strong><br>'+
                  (s.sedang_di_toko?'Status: Di '+s.sedang_di_toko+' (sejak '+s.jam_masuk_aktif+')<br>':'Status: Keliling / Idle<br>')+
                  'Update: '+(s.last_loc_at||'-')+'<br>'+
                  (s.last_akurasi_m!=null?'Akurasi: '+s.last_akurasi_m+' m<br>':'')+
                  '<a href="'+gUrl+'" target="_blank" rel="noopener noreferrer">Buka di Google Maps</a>';
    var mk=L.marker(pos,{icon:icon}).addTo(map).bindPopup(popupHtml);
    if(state.liveFokus&&state.liveFokus===s.kode){
      fokusMarker=mk;
      fokusCoord=pos;
    }
  });

  if(fokusCoord){
    map.setView(fokusCoord,16);
    if(fokusMarker)setTimeout(function(){try{fokusMarker.openPopup();}catch(e){}},200);
  }else if(latlngs.length===1){
    map.setView(latlngs[0],16);
  }else{
    map.fitBounds(L.latLngBounds(latlngs),{padding:[40,40],maxZoom:16});
  }
  setTimeout(function(){try{map.invalidateSize();}catch(e){}},150);
}

function jamKeDetik(j){
  var p=String(j||'').trim().split(':');
  return (Number(p[0])||0)*3600+(Number(p[1])||0)*60+(Number(p[2])||0);
}

function kunjunganUrutSales(kodeSales, tgl){
  return db.checkins.filter(function(c){
    return c.sales===kodeSales&&c.tanggal===tgl&&c.status_batal!=='BATAL';
  }).slice().sort(function(a,b){
    return jamKeDetik(a.jam_masuk)-jamKeDetik(b.jam_masuk);
  });
}

function koordinatKunjungan(c){
  if(c.lat!=null&&c.lng!=null&&isFinite(c.lat)&&isFinite(c.lng)&&!(c.lat===0&&c.lng===0)){
    return {lat:c.lat,lng:c.lng};
  }
  var o=outletByKode(c.kode_toko);
  if(o&&o.lat!=null&&o.lng!=null&&isFinite(o.lat)&&isFinite(o.lng)){
    return {lat:o.lat,lng:o.lng};
  }
  return null;
}

function linkGoogleMapsRute(titikList){
  if(!titikList.length)return '';
  if(titikList.length===1){
    return 'https://www.google.com/maps/search/?api=1&query='+titikList[0].lat+','+titikList[0].lng;
  }
  var parts=titikList.slice(0,25).map(function(p){return p.lat.toFixed(6)+','+p.lng.toFixed(6);});
  return 'https://www.google.com/maps/dir/'+parts.join('/');
}

function gambarPetaRute(containerId, kunjunganList){
  if(_petaInstance){
    try{_petaInstance.remove();}catch(e){}
    _petaInstance=null;
  }
  var elMap=document.getElementById(containerId);
  if(!elMap||typeof L==='undefined')return;

  var titik=[];
  kunjunganList.forEach(function(c,idx){
    var k=koordinatKunjungan(c);
    if(k)titik.push({no:idx+1,lat:k.lat,lng:k.lng,c:c});
  });

  if(!titik.length){
    elMap.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#6b7684;font-size:13px;padding:16px;text-align:center">Belum ada titik kunjungan GPS pada tanggal ini.</div>';
    return;
  }

  var map=L.map(elMap,{zoomControl:true});
  _petaInstance=map;

  L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{
    maxZoom:20,
    attribution:'&copy; Google Maps'
  }).addTo(map);

  var latlngs=[];
  titik.forEach(function(p,i){
    latlngs.push([p.lat,p.lng]);
    var cls='pin-mid';
    if(i===0)cls='pin-start';
    else if(i===titik.length-1&&titik.length>1)cls='pin-end';
    var icon=L.divIcon({
      className:'',
      html:'<div class="pin-num '+cls+'">'+p.no+'</div>',
      iconSize:[28,28],
      iconAnchor:[14,14],
      popupAnchor:[0,-14]
    });
    var waktu=p.c.jam_masuk+(p.c.jam_keluar?' s/d '+p.c.jam_keluar:' (masih di toko)');
    var popupHtml='<strong>#'+p.no+' '+p.c.nama_toko+'</strong><br>'+
                  'Kode: '+p.c.kode_toko+'<br>'+
                  'Jam: '+waktu+'<br>'+
                  'Status: '+p.c.validasi_status+
                  (p.c.jarak_m!=null?'<br>Jarak: '+p.c.jarak_m+' m':'');
    L.marker([p.lat,p.lng],{icon:icon}).addTo(map).bindPopup(popupHtml);
  });

  if(latlngs.length>1){
    L.polyline(latlngs,{color:'#1D6FE0',weight:4,opacity:0.85,dashArray:'8, 6'}).addTo(map);
  }

  if(latlngs.length===1){
    map.setView(latlngs[0],16);
  }else{
    map.fitBounds(L.latLngBounds(latlngs),{padding:[36,36],maxZoom:17});
  }
  setTimeout(function(){try{map.invalidateSize();}catch(e){}},150);
}

function renderKartuPetaTim(listSales){
  var c=el('div',{class:'card'});
  c.appendChild(el('div',{class:'label'},'Peta Rute Kunjungan Sales (Google Maps) - '+state.tanggal));

  if(!listSales.length){
    c.appendChild(el('div',{class:'muted'},'Belum ada sales yang dapat ditampilkan'));
    return c;
  }

  var adaPilih=listSales.some(function(u){return u.login===state.petaSales;});
  if(!adaPilih){
    var salesAdaKunj=null;
    for(var i=0;i<listSales.length;i++){
      if(kunjunganUrutSales(listSales[i].login,state.tanggal).length>0){salesAdaKunj=listSales[i].login;break;}
    }
    state.petaSales=salesAdaKunj||listSales[0].login;
  }

  var sel=el('select',{});
  listSales.forEach(function(u){
    var jml=kunjunganUrutSales(u.login,state.tanggal).length;
    var at={value:u.login};
    if(u.login===state.petaSales)at.selected='selected';
    sel.appendChild(el('option',at,u.login+' - '+u.nama+' ('+jml+' kunjungan)'));
  });
  sel.value=state.petaSales;
  sel.addEventListener('change',function(){
    state.petaSales=sel.value;
    render();
  });
  c.appendChild(sel);

  var kunj=kunjunganUrutSales(state.petaSales,state.tanggal);
  var titikValid=[];
  kunj.forEach(function(x){var k=koordinatKunjungan(x);if(k)titikValid.push(k);});

  c.appendChild(el('div',{class:'muted',style:'margin-top:8px'},
    'Hijau = Toko pertama (#1) · Biru = Toko berikutnya · Merah = Toko terakhir (#'+Math.max(1,kunj.length)+')'));

  var mapDiv=el('div',{id:'petaRuteSales',class:'map-box'});
  c.appendChild(mapDiv);

  if(titikValid.length){
    var gLink=linkGoogleMapsRute(titikValid);
    c.appendChild(el('a',{href:gLink,target:'_blank',rel:'noopener noreferrer',class:'btn-link'},
      'Buka Rute Lengkap di Google Maps ('+titikValid.length+' Titik)'));
  }

  if(kunj.length){
    var listWrap=el('div',{class:'rute-list'});
    kunj.forEach(function(x,idx){
      var cls='pin-mid';
      if(idx===0)cls='pin-start';
      else if(idx===kunj.length-1&&kunj.length>1)cls='pin-end';
      var step=el('div',{class:'rute-step'});
      step.appendChild(el('div',{class:'rute-no '+cls},String(idx+1)));
      var detail=el('div',{style:'flex:1'});
      detail.appendChild(el('div',{style:'font-weight:600;font-size:13px'},x.nama_toko+' ('+x.kode_toko+')'));
      detail.appendChild(el('div',{class:'muted'},
        'Jam: '+x.jam_masuk+(x.jam_keluar?' s/d '+x.jam_keluar:' - masih di toko')+' · '+x.validasi_status+
        (x.jarak_m!=null?' · '+x.jarak_m+' m':'')));
      step.appendChild(detail);
      listWrap.appendChild(step);
    });
    c.appendChild(listWrap);
  }else{
    c.appendChild(el('div',{class:'muted',style:'margin-top:8px'},'Sales ini belum memiliki kunjungan sah pada tanggal '+state.tanggal+'.'));
  }

  setTimeout(function(){gambarPetaRute('petaRuteSales',kunj);},30);
  return c;
}

  var list=daftarSalesTim(isAdmin);
  var c0=el('div',{class:'card'});
  c0.appendChild(el('div',{class:'label'},(isAdmin?'Semua Tim Sales':'Tim saya')+' - '+state.tanggal));
  c0.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Jumlah sales'),el('span',{class:'v'},String(list.length))));
  var totalKunj=0;
  list.forEach(function(u){totalKunj+=kunjunganUrutSales(u.login,state.tanggal).length;});
  c0.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Total kunjungan sah'),el('span',{class:'v'},String(totalKunj))));
  w.appendChild(c0);

  var pb=pesanBox(); if(pb)w.appendChild(pb);
  if(!list.length){
    w.appendChild(el('div',{class:'card muted'},isAdmin?'Belum ada user dengan role SALES':'Belum ada sales yang diizinkan admin'));
    return w;
  }

  w.appendChild(renderKartuPetaTim(list));

  var grid=el('div',{class:'grid2'});
  list.forEach(function(u){grid.appendChild(spvKartuSales(u));});
  w.appendChild(grid);
  return w;
}

function spvKartuSales(u){
  var tgl=state.tanggal;
  var cek=db.checkins.filter(function(c){return c.sales===u.login&&c.tanggal===tgl;});
  var aktif=null;
  for(var i=0;i<cek.length;i++){if(!cek[i].jam_keluar&&cek[i].status_batal!=='BATAL'){aktif=cek[i];break;}}
  var batal=cek.filter(function(c){return c.status_batal==='BATAL';});
  var tanpa=cek.filter(function(c){return c.validasi_status==='TANPA_TITIK'&&c.status_batal!=='BATAL';});
  var sah=cek.filter(function(c){return c.status_batal!=='BATAL';});
  var c=el('div',{class:'card'});
  var head=el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px'});
  head.appendChild(el('strong',{},u.nama));
  head.appendChild(el('span',{class:'badge '+(aktif?'b-hijau':'b-abu')},aktif?'DI TOKO':'IDLE'));
  c.appendChild(head);
  c.appendChild(el('div',{class:'muted'},u.login));
  if(aktif)c.appendChild(el('div',{class:'muted'},'Di '+aktif.nama_toko+' sejak '+aktif.jam_masuk));
  c.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Kunjungan sah'),el('span',{class:'v'},String(sah.length))));
  c.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Tanpa titik'),el('span',{class:'v'},String(tanpa.length))));
  c.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Dibatalkan'),el('span',{class:'v'},String(batal.length))));

  var btMap=el('button',{class:state.petaSales===u.login?'btn-primary':'btn-ghost',style:'width:100%;margin-top:8px'},
    state.petaSales===u.login?'Sedang Ditampilkan di Peta':'Lihat Peta Rute ('+sah.length+' Toko)');
  btMap.addEventListener('click',function(){
    state.petaSales=u.login;
    render();
    var m=document.getElementById('petaRuteSales');
    if(m)m.scrollIntoView({behavior:'smooth',block:'center'});
  });
  c.appendChild(btMap);
  return c;
}

function unduhCsv(teks,namaFile){
  try{
    var blob=new Blob(['\ufeff'+teks],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=namaFile;
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
    return true;
  }catch(e){return false;}
}

/* ===== BOOT ===== */
(function(){
  var simpan=null;
  try{simpan=JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){simpan=null;}
  if(!simpan||!simpan.kode){state.loading=false;render();return;}
  ambilInfoPerangkat();
  panggil('getBootstrap',[simpan.kode,getDeviceId()]).then(function(data){
    if(!data||!data.ok){
      localStorage.removeItem(SKEY);
      if(data&&data.msg){state.pesan=data.msg;state.pesanTipe='err';}
      state.loading=false;render();return;
    }
    state.user={kode:data.user.kode_sales,nama:data.user.nama,role:data.user.role,area:data.user.area};
    isiDB(data);
    state.loading=false;
    render();
  }).catch(function(){
    localStorage.removeItem(SKEY);
    state.loading=false;
    render();
  });
})();
