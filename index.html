<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-In Sales</title>
<style>
  :root{--biru:#0F2C4C;--aksen:#1D6FE0;--hijau:#12855B;--merah:#C7382E;--latar:#F5F7FA;--garis:#dde3ea;--teks:#1a2028;--redup:#6b7684}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--latar);color:var(--teks);font-size:14px;line-height:1.45}
  .wrap{max-width:430px;margin:0 auto;padding:0 0 70px;padding-bottom:96px;}
  .wrap.wide{max-width:1100px;padding:20px}
  header.app{background:var(--biru);color:#fff;padding:16px 18px;border-radius:0 0 14px 14px}
  header.app h1{margin:0;font-size:16px;font-weight:600}
  header.app .sub{font-size:12px;opacity:.75;margin-top:2px}
  .card{background:#fff;border-radius:10px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(16,38,64,.08)}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--redup);font-weight:600;margin-bottom:6px}
  select,input,textarea{width:100%;padding:10px;border:1px solid var(--garis);border-radius:8px;font:inherit;background:#fff}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:12px;font-weight:600}
  .btn-primary{background:var(--aksen);color:#fff;width:100%}
  .btn-danger{background:var(--merah);color:#fff;width:100%}
  .btn-ghost{background:#eef2f7;color:var(--biru);padding:8px 12px;font-size:12px}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:6px}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .b-hijau{background:#e3f4ec;color:var(--hijau)}
  .b-merah{background:#fbe9e7;color:var(--merah)}
  .b-kuning{background:#fdf3e0;color:#8a6100}
  .b-abu{background:#eef2f7;color:var(--redup)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0f3f7}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--redup);font-size:12px}
  .row .v{font-weight:600;font-size:13px;text-align:right}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:var(--biru);color:#fff;text-align:left;padding:7px 8px;font-weight:600}
  td{padding:7px 8px;border-bottom:1px solid #eef2f7;vertical-align:top}
  tr:nth-child(even) td{background:#fafbfd}
  .kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
  .kpi .box{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(16,38,64,.08)}
  .kpi .n{font-size:22px;font-weight:700;color:var(--biru)}
  .kpi .t{font-size:11px;color:var(--redup);text-transform:uppercase;font-weight:600}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--garis);display:flex;max-width:430px;margin:0 auto}
  .nav button{flex:1;background:none;color:var(--redup);padding:10px 0;font-size:12px;border-radius:0}
  .nav button.on{color:var(--aksen);font-weight:700}
  .nav.wide{max-width:1100px}
  .grid2{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:900px){.grid2{grid-template-columns:1fr 1fr;gap:12px;align-items:start}}
  .nav button{padding:14px 0;min-height:48px}
  .wrap.wide{padding-bottom:96px}
  .err{background:#fbe9e7;color:var(--merah);padding:10px 12px;border-radius:8px;font-size:12px;margin:8px 0}
  .ok{background:#e3f4ec;color:var(--hijau);padding:10px 12px;border-radius:8px;font-size:12px;margin:8px 0}
  .warn{color:#8a6d1f;background:#fdf3d6;border-radius:8px;padding:6px 8px;font-size:12px;margin-top:6px;}
.muted{color:var(--redup);font-size:12px}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{background:#eef2f7;color:var(--biru);padding:8px 12px;font-size:12px}
  .tabs button.on{background:var(--aksen);color:#fff}
  .modal-bg{position:fixed;inset:0;background:rgba(15,44,76,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
  .modal-box{background:#fff;border-radius:12px;padding:18px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.22)}
  .modal-box h2{margin:0 0 8px;font-size:16px;color:var(--biru)}
  .modal-actions{display:flex;gap:8px;margin-top:14px}
  .modal-actions button{flex:1}
  button:disabled{opacity:.55;cursor:not-allowed}
  .dd-wrap{position:relative}
  .dd-btn{width:100%;padding:10px 12px;border:1px solid var(--garis);border-radius:8px;background:#fff;color:var(--teks);font-weight:500;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dd-btn:focus{outline:2px solid var(--aksen);border-color:var(--aksen)}
  .dd-btn .dd-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .dd-btn .dd-arr{color:var(--redup);font-size:12px;flex-shrink:0}
  .dd-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--garis);border-radius:10px;box-shadow:0 8px 24px rgba(15,44,76,.15);z-index:60;display:none;overflow:hidden}
  .dd-menu.open{display:block}
  .dd-search-box{padding:8px;border-bottom:1px solid #eef2f7;background:#fafbfd}
  .dd-search-box input{padding:8px 10px;font-size:13px}
  .dd-list{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .dd-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f4f6f9}
  .dd-item:last-child{border-bottom:none}
  .dd-item:hover{background:#f2f6fc}
  .dd-item.on{background:#e7f1fd}
  .dd-item .dd-main{font-size:13px;font-weight:600;color:var(--teks)}
  .dd-item.on .dd-main{color:var(--aksen)}
  .dd-item .dd-sub{font-size:11px;color:var(--redup);margin-top:2px}
  .dd-empty{padding:12px;text-align:center;color:var(--redup);font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading" style="position:fixed;inset:0;background:rgba(245,247,250,.9);display:none;align-items:center;justify-content:center;z-index:99;font-weight:600;color:#0F2C4C">Memuat...</div>
<script>
/* ===== ADAPTER SERVER ===== */
var state={user:null,tab:'toko',adminTab:'titik',spvTab:'tim',pesan:null,pesanTipe:'ok',lokasi:null,akurasi:null,gpsStatus:'idle',gpsErr:null,konfirmasiToko:null,tokoPanel:null,cariToko:'',csvPreview:null,csvNamaFile:'',csvErr:null,loading:true,tanggal:'',hariIni:'',pilihToko:null};
var db={outlets:[],checkins:[],users:[],aksesSPV:[],audit:[],settings:{radius_default:100,akurasi_maks:50,jam_mulai:'07:00',jam_selesai:'17:00',radius_min:30,radius_maks:300}};
var SKEY='checkin_gas_sesi_v1';

var API_URL='https://script.google.com/macros/s/AKfycbwfs31wIlYlptkHJYuv_GXruPB8PZp188svfy5QK2C7OBgR9ReX7VMI-W35nRR9JZcmiA/exec';

function panggil(fn,args){
  return fetch(API_URL,{
    method:'POST',
    redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({fn:fn,args:args||[]})
  }).then(function(res){
    return res.text().then(function(txt){
      if(!res.ok)throw new Error('HTTP '+res.status);
      try{return JSON.parse(txt);}
      catch(e){throw new Error('Respons server bukan JSON (pastikan doPost sudah di-deploy dengan akses Anyone)');}
    });
  });
}

function nowDate(){return state.tanggal;}
function pad2(n){return String(n).padStart(2,'0');}

function namaSales(kode){
  if(state.user&&state.user.kode===kode)return state.user.nama;
  for(var i=0;i<db.users.length;i++){if(db.users[i].login===kode)return db.users[i].nama;}
  return kode;
}

function mapOutlet(o){
  return {
    kode:String(o.kode_toko==null?'':o.kode_toko), nama:String(o.nama_toko==null?'':o.nama_toko), alamat:String(o.alamat==null?'':o.alamat), kota:String(o.kota==null?'':o.kota), kecamatan:String(o.kecamatan==null?'':o.kecamatan),
    lat:(o.latitude===''||o.latitude==null)?null:Number(o.latitude),
    lng:(o.longitude===''||o.longitude==null)?null:Number(o.longitude),
    radius:(o.radius_m===''||o.radius_m==null)?null:Number(o.radius_m),
    status:o.status_titik, aktif:o.aktif
  };
}

function mapCheckin(c){
  return {
    checkin_id:c.checkin_id, tanggal:String(c.tanggal), sales:c.kode_sales, nama_sales:namaSales(c.kode_sales),
    kode_toko:c.kode_toko, nama_toko:c.nama_toko_snapshot,
    jam_masuk:c.jam_masuk, jam_keluar:c.jam_keluar||'',
    akurasi_m:(c.akurasi_m===''||c.akurasi_m==null)?null:Number(c.akurasi_m),
    jarak_m:(c.jarak_m===''||c.jarak_m==null)?null:Number(c.jarak_m),
    validasi_status:c.validasi_status, status_batal:c.status_batal||'AKTIF',
    alasan_batal:c.alasan_batal||'', dibatalkan_by:c.dibatalkan_by||'', dibatalkan_at:c.dibatalkan_at||''
  };
}

function isiDB(data){
  var s=data.settings||{};
  db.settings={radius_default:s.radius_default_m||100,akurasi_maks:s.akurasi_maks_m||50,
    jam_mulai:s.jam_kerja_mulai||'07:00',jam_selesai:s.jam_kerja_selesai||'17:00',
    radius_min:s.radius_min_m||30,radius_maks:s.radius_maks_m||300};
  state.tanggal=data.tanggal||'';
  state.hariIni=data.tanggal||'';
  db.users=(data.users||[]).map(function(u){return {login:u.kode_sales,nama:u.nama,role:u.role,aktif:u.aktif};});
  db.outlets=(data.outlets||[]).map(mapOutlet);
  db.checkins=(data.checkins||[]).map(mapCheckin);
  db.aksesSPV=(data.aksesSPV||[]).map(function(a){
    return typeof a==='string'?{spv:state.user.kode,kode_sales:a,aktif:true}:{spv:a.spv_user_id,kode_sales:a.kode_sales,aktif:a.aktif};
  });
  db.audit=(data.audit||[]).map(function(l){return {log_id:l.log_id,timestamp:l.timestamp,user:l.user_id,aksi:l.aksi,detail:l.detail};});
}

function muatData(){
  if(!state.user)return Promise.resolve();
  return panggil('getBootstrap',[state.user.kode]).then(function(data){
    if(!data||!data.ok)throw new Error((data&&data.msg)||'Gagal memuat data');
    isiDB(data);
    state.user={kode:data.user.kode_sales,nama:data.user.nama,role:data.user.role,area:data.user.area};
    state.loading=false;
  });
}

function tampilLoading(on){
  var el2=document.getElementById('loading');
  if(el2)el2.style.display=on?'flex':'none';
}

function jalankan(p){
  state.pesan=null;tampilLoading(true);
  return p.then(function(r){
    if(r&&r.ok===false){state.pesan=r.msg||'Gagal';state.pesanTipe='err';return null;}
    state.pesan=(r&&r.msg)?r.msg:'Tersimpan';state.pesanTipe='ok';
    return muatData();
  }).catch(function(e){
    state.pesan='Gagal: '+(e&&e.message?e.message:e);state.pesanTipe='err';
  }).then(function(){
    tampilLoading(false);render();
  });
}

function cekAkses(kodeInput,pinInput){
  var kode=String(kodeInput||'').trim().toUpperCase();
  var pin=String(pinInput||'').trim();
  if(!kode||!pin)return Promise.resolve({ok:false,msg:'ID dan PIN wajib diisi'});
  tampilLoading(true);
  return panggil('login',[kode,pin]).then(function(r){
    if(!r.ok){tampilLoading(false);return r;}
    state.user={kode:r.user.kode_sales,nama:r.user.nama,role:r.user.role,area:r.user.area};
    localStorage.setItem(SKEY,JSON.stringify({kode:state.user.kode}));
    return muatData().then(function(){tampilLoading(false);return {ok:true,msg:r.msg};});
  }).catch(function(e){tampilLoading(false);return {ok:false,msg:String(e&&e.message?e.message:e)};});
}

function logout(){
  localStorage.removeItem(SKEY);
  state.user=null;state.tab='toko';state.adminTab='titik';state.spvTab='tim';state.pesan=null;
  state.pilihToko=null;state.lokasi=null;state.akurasi=null;state.gpsStatus='idle';state.gpsErr=null;state.konfirmasiToko=null;state.tokoPanel=null;state.cariToko='';state.csvPreview=null;state.csvNamaFile='';state.csvErr=null;
  db.checkins=[];db.outlets=[];db.users=[];db.aksesSPV=[];db.audit=[];
  render();
}

function cekinAktif(){
  if(!state.user)return null;
  for(var i=0;i<db.checkins.length;i++){
    var c=db.checkins[i];
    if(c.sales===state.user.kode&&c.tanggal===state.tanggal&&!c.jam_keluar&&c.status_batal!=='BATAL')return c;
  }
  return null;
}

function outletByKode(k){var kk=String(k==null?'':k);for(var i=0;i<db.outlets.length;i++){if(String(db.outlets[i].kode)===kk)return db.outlets[i];}return null;}
function adaTitik(o){return o&&o.status==='TITIK_FINAL'&&o.lat!=null&&o.lng!=null;}

/* ===== API ===== */
var api={
  checkin:function(kodeToko,lat,lng,akurasi){return panggil('checkin',[state.user.kode,kodeToko,lat,lng,akurasi,String(navigator.userAgent||'')]);},
  checkout:function(id){return panggil('checkout',[state.user.kode,id]);},
  setTitikToko:function(kode,lat,lng,radius){return panggil('setTitikToko',[state.user.kode,kode,lat,lng,radius]);},
  hapusTitikToko:function(kode){return panggil('hapusTitikToko',[state.user.kode,kode]);},
  setRadiusSemuaToko:function(radius){return panggil('setRadiusSemuaToko',[state.user.kode,radius]);},
  tambahToko:function(kodeToko,namaToko,alamat,kota,kecamatan,lat,lng,radius){return panggil('tambahToko',[state.user.kode,kodeToko,namaToko,alamat,kota,kecamatan,lat,lng,radius]);},
  importToko:function(listToko){return panggil('importToko',[state.user.kode,listToko]);},
  batalKunjungan:function(id,alasan){return panggil('batalKunjungan',[state.user.kode,id,alasan]);},
  setAksesSPV:function(spv,kodeSales,aktif){return panggil('setAksesSPV',[state.user.kode,spv,kodeSales,aktif]);},
  resetPin:function(target,pin){return panggil('resetPin',[state.user.kode,target,pin]);},
  setUserAktif:function(target,aktif){return panggil('setUserAktif',[state.user.kode,target,aktif]);},
  exportRekap:function(tanggal){return panggil('exportRekap',[state.user.kode,tanggal]);},
  tambahUser:function(kodeSales,nama,email,role,area,pin){return panggil('tambahUser',[state.user.kode,nama,email,kodeSales,role,area,pin]);}
};

/* ===== UI DASAR ===== */
function el(tag,attrs){
  var kids=Array.prototype.slice.call(arguments,2);
  var e=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    if(k.indexOf('on')===0&&typeof attrs[k]==='function'){e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);}
    else if(k==='class'){e.className=attrs[k];}
    else if(k==='html'){e.innerHTML=attrs[k];}
    else if(k==='disabled'){e.disabled=!!attrs[k];}
    else{e.setAttribute(k,attrs[k]);}
  });}
  kids.forEach(function(k){
    if(k==null||k===false)return;
    e.appendChild((typeof k==='string'||typeof k==='number')?document.createTextNode(String(k)):k);
  });
  return e;
}
function pesanBox(){if(!state.pesan)return el('div',{});return el('div',{class:state.pesanTipe==='err'?'err':'ok'},state.pesan);}
function badgeKelas(s){
  if(s==='FINAL_DALAM_RADIUS')return 'b-hijau';
  if(s==='TANPA_TITIK')return 'b-kuning';
  if(s==='BATAL')return 'b-merah';
  return 'b-abu';
}
function batalPesan(){
  if(state.pesan){state.pesan=null;state.pesanTipe='ok';}
}

function render(){
  var app=document.getElementById('app');
  app.innerHTML='';
  if(state.loading){app.appendChild(el('div',{class:'wrap'},el('div',{class:'card muted'},'Memuat data...')));return;}
  if(!state.user){app.appendChild(renderLogin());return;}
  if(state.user.role==='SALES'){app.appendChild(renderSales());return;}
  if(state.user.role==='ADMIN'){app.appendChild(renderAdmin());return;}
  app.appendChild(renderSpv());
}

function renderLogin(){
  var w=el('div',{class:'wrap'});
  w.appendChild(el('header',{class:'app'},el('h1',{},'Check-in Sales'),el('div',{class:'sub'},'PT Citra Mandiri Distribusindo')));
  var c=el('div',{class:'card'});
  c.appendChild(el('div',{class:'label'},'ID Pengguna'));
  var inLogin=el('input',{id:'inLogin',placeholder:'contoh: SL-01',autocomplete:'off'});
  c.appendChild(inLogin);
  c.appendChild(el('div',{class:'label',style:'margin-top:12px'},'PIN'));
  var inPin=el('input',{id:'inPin',type:'password',inputmode:'numeric',placeholder:'PIN Anda'});
  c.appendChild(inPin);
  c.appendChild(pesanBox());
  var btn=el('button',{class:'btn-primary',style:'margin-top:12px'},'Masuk');
  btn.addEventListener('click',function(){
    btn.disabled=true;btn.textContent='Memeriksa...';
    cekAkses(inLogin.value,inPin.value).then(function(r){
      state.pesan=r&&r.ok?null:(r&&r.msg)||'Login gagal';
      state.pesanTipe=r&&r.ok?'ok':'err';
      render();
    });
  });
  c.appendChild(btn);
  w.appendChild(c);
  return w;
}

/* ===== SALES ===== */
function mulaiGPS(paksa){
  if(!paksa&&state.gpsStatus!=='idle')return;
  if(!navigator.geolocation){
    state.gpsStatus='err';
    state.gpsErr='Perangkat atau browser tidak mendukung GPS.';
    render();
    return;
  }
  state.gpsStatus='loading';
  state.gpsErr=null;
  render();
  navigator.geolocation.getCurrentPosition(function(p){
    state.lokasi={lat:p.coords.latitude,lng:p.coords.longitude};
    state.akurasi=Math.round(p.coords.accuracy||0);
    state.gpsStatus='ok';
    state.gpsErr=null;
    render();
  },function(e){
    state.gpsStatus='err';
    var msg='GPS gagal diambil ('+e.message+'). Pastikan GPS aktif & izinkan akses lokasi di browser, lalu klik Refresh GPS.';
    state.gpsErr=msg;
    render();
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

function renderModalKonfirmasi(toko){
  var bg=el('div',{class:'modal-bg'});
  var box=el('div',{class:'modal-box'});
  box.appendChild(el('h2',{},'Konfirmasi Lokasi Toko'));
  box.appendChild(el('div',{class:'warn',style:'margin-bottom:10px'},
    'Toko ini belum memiliki titik GPS final. Check-in akan dicatat dengan status TANPA_TITIK.'));
  box.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Toko'),el('span',{class:'v'},toko.kode+' - '+toko.nama)));
  if(toko.alamat){
    box.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Alamat'),el('span',{class:'v'},toko.alamat+(toko.kota?', '+toko.kota:''))));
  }
  box.appendChild(el('div',{class:'row'},el('span',{class:'k'},'GPS Anda'),
    el('span',{class:'v'},state.lokasi?state.lokasi.lat.toFixed(6)+', '+state.lokasi.lng.toFixed(6):'-')));
  box.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Akurasi'),
    el('span',{class:'v'},state.akurasi!=null?state.akurasi+' m':'-')));
  box.appendChild(el('div',{style:'margin-top:10px;font-weight:600;font-size:13px'},
    'Apakah Anda benar-benar sedang berada di lokasi toko ini?'));

  var act=el('div',{class:'modal-actions'});
  var btnBatal=el('button',{class:'btn-ghost'},'Batal');
  btnBatal.addEventListener('click',function(){
    state.konfirmasiToko=null;
    render();
  });
  var btnYa=el('button',{class:'btn-primary'},'Ya, Saya di Toko Ini');
  btnYa.addEventListener('click',function(){
    var kode=toko.kode;
    state.konfirmasiToko=null;
    btnYa.disabled=true;btnYa.textContent='Mengirim...';
    jalankan(api.checkin(kode,state.lokasi.lat,state.lokasi.lng,state.akurasi));
  });
  act.appendChild(btnBatal);
  act.appendChild(btnYa);
  box.appendChild(act);
  bg.appendChild(box);
  return bg;
}

function renderSales(){
  var w=el('div',{class:'wrap'});
  w.appendChild(el('header',{class:'app'},el('h1',{},state.user.nama),el('div',{class:'sub'},'Sales - '+state.user.kode)));
  if(state.tab==='toko')w.appendChild(layarToko());
  if(state.tab==='riwayat')w.appendChild(layarRiwayat());
  var nav=el('div',{class:'nav'});
  [['toko','Toko'],['riwayat','Riwayat']].forEach(function(p){
    var b=el('button',{class:state.tab===p[0]?'on':''},p[1]);
    b.addEventListener('click',function(){state.tab=p[0];batalPesan();render();});
    nav.appendChild(b);
  });
  var out=el('button',{},'Keluar');

function parseCsvBaris(teks, delim){
  var rows=[], cur=[], val='', inQ=false;
  for(var i=0;i<teks.length;i++){
    var ch=teks[i], nx=teks[i+1];
    if(inQ){
      if(ch==='"'&&nx==='"'){val+='"';i++;}
      else if(ch==='"'){inQ=false;}
      else{val+=ch;}
    }else{
      if(ch==='"'){inQ=true;}
      else if(ch===delim){cur.push(val.trim());val='';}
      else if(ch==='\r'&&nx==='\n'){cur.push(val.trim());rows.push(cur);cur=[];val='';i++;}
      else if(ch==='\n'||ch==='\r'){cur.push(val.trim());rows.push(cur);cur=[];val='';}
      else{val+=ch;}
    }
  }
  if(val!==''||cur.length>0){cur.push(val.trim());rows.push(cur);}
  return rows.filter(function(r){return r.some(function(x){return x!=='';});});
}

function parseCsvToko(raw){
  var teks=String(raw||'').replace(/^\ufeff/,'').trim();
  if(!teks)return {ok:false,msg:'File CSV kosong'};
  var firstLine=teks.split(/\r?\n/)[0]||'';
  var semiCount=(firstLine.match(/;/g)||[]).length;
  var commaCount=(firstLine.match(/,/g)||[]).length;
  var delim=semiCount>commaCount?';':',';
  var rows=parseCsvBaris(teks,delim);
  if(rows.length<2)return {ok:false,msg:'CSV harus memiliki baris header dan minimal 1 baris data'};

  var norm=function(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');};
  var head=rows[0].map(norm);
  var findCol=function(aliases){
    for(var i=0;i<aliases.length;i++){
      var idx=head.indexOf(aliases[i]);
      if(idx>=0)return idx;
    }
    return -1;
  };
  var cKode=findCol(['kodetoko','kode','idtoko','id']);
  var cNama=findCol(['namatoko','nama','toko','outlet','namaoutlet']);
  var cAlamat=findCol(['alamat','address']);
  var cKota=findCol(['kota','city','kabupaten']);
  var cKec=findCol(['kecamatan','area','district']);
  var cLat=findCol(['latitude','lat']);
  var cLng=findCol(['longitude','lng','lon','long']);
  var cRad=findCol(['radiusm','radius','radiusmaksmeter']);

  if(cKode<0||cNama<0){
    return {ok:false,msg:'Header CSV wajib memiliki kolom kode_toko dan nama_toko'};
  }
  var items=[];
  for(var r=1;r<rows.length;r++){
    var row=rows[r];
    var kt=String(row[cKode]||'').trim().toUpperCase();
    var nm=String(row[cNama]||'').trim();
    if(!kt||!nm)continue;
    items.push({
      kode_toko:kt,
      nama_toko:nm,
      alamat:cAlamat>=0?(row[cAlamat]||''):'',
      kota:cKota>=0?(row[cKota]||''):'',
      kecamatan:cKec>=0?(row[cKec]||''):'',
      latitude:cLat>=0?(row[cLat]||''):'',
      longitude:cLng>=0?(row[cLng]||''):'',
      radius_m:cRad>=0?(row[cRad]||''):''
    });
  }
  if(!items.length)return {ok:false,msg:'Tidak ada baris toko yang valid (kode_toko dan nama_toko wajib terisi)'};
  return {ok:true,items:items,delim:delim};
}

    var filtered=db.outlets.filter(function(o){
      if(!key)return true;
      var hay=(o.kode+' '+o.nama+' '+o.alamat+' '+o.kota+' '+(o.kecamatan||'')).toLowerCase();
      return hay.indexOf(key)>=0;
    });
    if(!filtered.length){
      grid.appendChild(el('div',{class:'card muted'},'Tidak ada toko yang cocok dengan pencarian'));
      return;
    }
    filtered.forEach(function(o){grid.appendChild(adminKartuToko(o));});
  }
  inCari.addEventListener('input',function(){
    state.cariToko=inCari.value;
    renderGridToko(inCari.value);
  });
  renderGridToko(state.cariToko);
  w.appendChild(grid);
  return w;
}

function adminKartuToko(o){
  var c=el('div',{class:'card'});
  var head=el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px'});
  head.appendChild(el('strong',{},(adaTitik(o)?'\u25CF ':'\u25CB ')+o.kode));
  head.appendChild(el('span',{class:'badge '+(adaTitik(o)?'b-hijau':'b-kuning')},adaTitik(o)?'ADA TITIK':'TANPA TITIK'));
  c.appendChild(head);
  c.appendChild(el('div',{},o.nama));
  var lokasiTeks=[o.alamat,o.kecamatan?'Kec. '+o.kecamatan:'',o.kota].filter(Boolean).join(', ');
  if(lokasiTeks)c.appendChild(el('div',{class:'muted'},lokasiTeks));
  if(adaTitik(o)){
    c.appendChild(el('div',{class:'muted'},'Titik '+o.lat.toFixed(6)+', '+o.lng.toFixed(6)+' - radius '+o.radius+' m'));
  }else{
    c.appendChild(el('div',{class:'warn'},'Belum ada titik GPS'));
  }
  c.appendChild(adminFormTitik(o));
  return c;
}

function adminFormTitik(o){
  var c=el('div',{style:'border-top:1px solid #eef2f7;margin-top:10px;padding-top:10px'});
  c.appendChild(el('div',{class:'label'},'Set titik '+o.kode+' (Kota & Kecamatan otomatis dari GPS)'));
  var lat=el('input',{type:'number',step:'0.000001',placeholder:'latitude',value:o.lat!=null?o.lat:''});
  var lng=el('input',{type:'number',step:'0.000001',placeholder:'longitude',value:o.lng!=null?o.lng:''});
  var rad=el('input',{type:'number',placeholder:'radius meter',value:o.radius!=null?o.radius:db.settings.radius_default});
  c.appendChild(el('div',{class:'label',style:'margin-top:8px'},'Latitude'));c.appendChild(lat);
  c.appendChild(el('div',{class:'label',style:'margin-top:6px'},'Longitude'));c.appendChild(lng);
  c.appendChild(el('div',{class:'label',style:'margin-top:6px'},'Radius (meter)'));c.appendChild(rad);
  var simpan=el('button',{class:'btn-primary',style:'margin-top:8px'},'Simpan Titik');
  simpan.addEventListener('click',function(){
    var a=Number(lat.value),b=Number(lng.value);
    if(!a||!b){state.pesan='Isi latitude dan longitude';state.pesanTipe='err';render();return;}
    simpan.disabled=true;simpan.textContent='Menyimpan...';
    jalankan(api.setTitikToko(o.kode,a,b,Number(rad.value)||db.settings.radius_default));
  });
  c.appendChild(simpan);
  if(adaTitik(o)){
    var hapus=el('button',{class:'btn-danger',style:'margin-top:8px'},'Hapus Titik');
    hapus.addEventListener('click',function(){
      hapus.disabled=true;hapus.textContent='Menghapus...';
      jalankan(api.hapusTitikToko(o.kode));
    });
    c.appendChild(hapus);
  }
  return c;
}

function adminKartuKunjungan(c){
  var b=el('div',{class:'card'});
  var st=c.status_batal==='BATAL'?'BATAL':c.validasi_status;
  var head=el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px'});
  head.appendChild(el('strong',{},c.nama_toko));
  head.appendChild(el('span',{class:'badge '+badgeKelas(st)},st));
  b.appendChild(head);
  b.appendChild(el('div',{class:'muted'},c.nama_sales+' ('+c.sales+') - '+c.jam_masuk+(c.jam_keluar?' s/d '+c.jam_keluar:' - belum out')));
  if(c.jarak_m!=null)b.appendChild(el('div',{class:'muted'},'Jarak '+c.jarak_m+' m, akurasi '+(c.akurasi_m!=null?c.akurasi_m+' m':'-')));
  if(c.status_batal==='BATAL'){
    b.appendChild(el('div',{class:'err'},'Dibatalkan '+c.dibatalkan_by+' - '+c.alasan_batal));
  }else{
    var al=el('input',{placeholder:'alasan pembatalan (wajib)'});
    b.appendChild(al);
    var bt=el('button',{class:'btn-danger',style:'margin-top:8px'},'Batalkan Kunjungan');
    bt.addEventListener('click',function(){
      if(!al.value.trim()){state.pesan='Alasan pembatalan wajib diisi';state.pesanTipe='err';render();return;}
      bt.disabled=true;bt.textContent='Membatalkan...';
      jalankan(api.batalKunjungan(c.checkin_id,al.value));
    });
    b.appendChild(bt);
  }
  return b;
}

function adminFormUser(){

  var fRole=el('select',{id:'nuRole',style:'margin-top:8px'});
  ['SALES','SPV','ADMIN'].forEach(function(r){fRole.appendChild(el('option',{value:r},r));});

/* ===== SPV ===== */
function salesUntukSPV(login){
  return db.aksesSPV.filter(function(a){return a.spv===login&&a.aktif;}).map(function(a){return a.kode_sales;});
}

function renderSpv(){
  var w=el('div',{class:'wrap wide'});
  w.appendChild(el('header',{class:'app'},el('h1',{},state.user.nama),el('div',{class:'sub'},'Supervisor - '+state.user.kode)));
  w.appendChild(pemilihTanggal());
  if(state.spvTab==='tim')w.appendChild(spvTim());
  if(state.spvTab==='rekap')w.appendChild(spvRekap());
  if(state.spvTab==='toko')w.appendChild(spvToko());
  var nav=el('div',{class:'nav wide'});
  [['tim','Tim'],['rekap','Rekap'],['toko','Toko']].forEach(function(p){
    var b=el('button',{class:state.spvTab===p[0]?'on':''},p[1]);
    b.addEventListener('click',function(){state.spvTab=p[0];batalPesan();render();});
    nav.appendChild(b);
  });
  var out=el('button',{},'Keluar');
  out.addEventListener('click',function(){logout();});
  nav.appendChild(out);
  w.appendChild(nav);
  return w;
}

function spvSalesList(){
  var kode=salesUntukSPV(state.user.kode);
  return db.users.filter(function(u){return u.role==='SALES'&&kode.indexOf(u.login)>=0;});
}

function spvTim(){
  var w=el('div',{});
  var list=spvSalesList();
  var c0=el('div',{class:'card'});
  c0.appendChild(el('div',{class:'label'},'Tim saya - '+state.tanggal));
  c0.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Jumlah sales'),el('span',{class:'v'},String(list.length))));
  w.appendChild(c0);
  var pb=pesanBox(); if(pb)w.appendChild(pb);
  if(!list.length){w.appendChild(el('div',{class:'card muted'},'Belum ada sales yang diizinkan admin'));return w;}
  var grid=el('div',{class:'grid2'});
  list.forEach(function(u){grid.appendChild(spvKartuSales(u));});
  w.appendChild(grid);
  return w;
}

function spvKartuSales(u){
  var tgl=state.tanggal;
  var cek=db.checkins.filter(function(c){return c.sales===u.login&&c.tanggal===tgl;});
  var aktif=null;
  for(var i=0;i<cek.length;i++){if(!cek[i].jam_keluar&&cek[i].status_batal!=='BATAL'){aktif=cek[i];break;}}
  var batal=cek.filter(function(c){return c.status_batal==='BATAL';});
  var tanpa=cek.filter(function(c){return c.validasi_status==='TANPA_TITIK'&&c.status_batal!=='BATAL';});
  var c=el('div',{class:'card'});
  var head=el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px'});
  head.appendChild(el('strong',{},u.nama));
  head.appendChild(el('span',{class:'badge '+(aktif?'b-hijau':'b-abu')},aktif?'DI TOKO':'IDLE'));
  c.appendChild(head);
  c.appendChild(el('div',{class:'muted'},u.login));
  if(aktif)c.appendChild(el('div',{class:'muted'},'Di '+aktif.nama_toko+' sejak '+aktif.jam_masuk));
  c.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Kunjungan'),el('span',{class:'v'},String(cek.length))));
  c.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Tanpa titik'),el('span',{class:'v'},String(tanpa.length))));
  c.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Dibatalkan'),el('span',{class:'v'},String(batal.length))));
  return c;
}

function unduhCsv(teks,namaFile){
  try{
    var blob=new Blob(['\ufeff'+teks],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=namaFile;
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
    return true;
  }catch(e){return false;}
}

function spvRekap(){
  var w=el('div',{});
  var kode=salesUntukSPV(state.user.kode);
  var semua=db.checkins.filter(function(c){return c.tanggal===state.tanggal&&kode.indexOf(c.sales)>=0;});
  var sah=semua.filter(function(c){return c.status_batal!=='BATAL';});
  var c0=el('div',{class:'card'});
  c0.appendChild(el('div',{class:'label'},'Rekap tim '+state.tanggal));
  c0.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Total kunjungan sah'),el('span',{class:'v'},String(sah.length))));
  c0.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Dalam radius'),el('span',{class:'v'},String(sah.filter(function(c){return c.validasi_status==='FINAL_DALAM_RADIUS';}).length))));
  c0.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Tanpa titik'),el('span',{class:'v'},String(sah.filter(function(c){return c.validasi_status==='TANPA_TITIK';}).length))));
  c0.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Dibatalkan'),el('span',{class:'v'},String(semua.length-sah.length))));
  w.appendChild(c0);
  var pb=pesanBox(); if(pb)w.appendChild(pb);
  var bx=el('button',{class:'btn-primary',style:'margin-top:8px'},'Export CSV');
  bx.addEventListener('click',function(){
    bx.disabled=true;bx.textContent='Menyiapkan...';
    state.pesan=null;
    api.exportRekap(state.tanggal).then(function(r){
      bx.disabled=false;bx.textContent='Export CSV';
      if(!r||r.ok===false){state.pesan=(r&&r.msg)||'Export gagal';state.pesanTipe='err';render();return;}
      var nama='rekap-'+state.tanggal+'.csv';
      if(unduhCsv(r.csv,nama)){state.pesan='Export siap: '+r.jumlah+' kunjungan ('+nama+')';state.pesanTipe='ok';render();}
      else{state.pesan='Browser memblokir unduhan. Salin CSV dari kotak di bawah.';state.pesanTipe='err';
        var ta=el('textarea',{style:'width:100%;height:160px;margin-top:8px'});ta.value=r.csv;
        var lama=document.getElementById('csvManual');if(lama)lama.remove();
        ta.id='csvManual';document.getElementById('app').appendChild(ta);}
    }).catch(function(e){
      bx.disabled=false;bx.textContent='Export CSV';
      state.pesan='Export gagal: '+(e&&e.message?e.message:e);state.pesanTipe='err';render();
    });
  });
  c0.appendChild(bx);
  if(!sah.length){w.appendChild(el('div',{class:'card muted'},'Belum ada kunjungan tim hari ini'));return w;}
  sah.slice().reverse().forEach(function(c){
    var b=el('div',{class:'card'});
    var head=el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px'});
    head.appendChild(el('strong',{},c.nama_toko));
    head.appendChild(el('span',{class:'badge '+badgeKelas(c.validasi_status)},c.validasi_status));
    b.appendChild(head);
    b.appendChild(el('div',{class:'muted'},c.nama_sales+' - '+c.jam_masuk+(c.jarak_m!=null?' - '+c.jarak_m+' m':'')));
    w.appendChild(b);
  });
  return w;
}

function spvToko(){
  var w=el('div',{});
  var ada=db.outlets.filter(function(o){return adaTitik(o);}).length;
  var c0=el('div',{class:'card'});
  c0.appendChild(el('div',{class:'label'},'Status titik toko'));
  c0.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Ada titik'),el('span',{class:'v'},String(ada))));
  c0.appendChild(el('div',{class:'row'},el('span',{class:'k'},'Tanpa titik'),el('span',{class:'v'},String(db.outlets.length-ada))));
  w.appendChild(c0);
  db.outlets.filter(function(o){return !adaTitik(o);}).forEach(function(o){
    var b=el('div',{class:'card'});
    var head=el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px'});
    head.appendChild(el('strong',{},'\u25CB '+o.kode));
    head.appendChild(el('span',{class:'badge b-kuning'},'TANPA TITIK'));
    b.appendChild(head);
    b.appendChild(el('div',{},o.nama));
    b.appendChild(el('div',{class:'muted'},o.alamat+', '+o.kota));
    b.appendChild(el('div',{class:'warn'},'Minta admin pusat set titik GPS'));
    w.appendChild(b);
  });
  return w;
}

/* ===== BOOT ===== */
(function(){
  var simpan=null;
  try{simpan=JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){simpan=null;}
  if(!simpan||!simpan.kode){state.loading=false;render();return;}
  panggil('getBootstrap',[simpan.kode]).then(function(data){
    if(!data||!data.ok){localStorage.removeItem(SKEY);state.loading=false;render();return;}
    state.user={kode:data.user.kode_sales,nama:data.user.nama,role:data.user.role,area:data.user.area};
    isiDB(data);
    state.loading=false;
    render();
  }).catch(function(){
    localStorage.removeItem(SKEY);
    state.loading=false;
    render();
  });
})();
